# 動作確認専用: Prometheus -> Alertmanager -> SNS の経路疎通を必ず発火させて検証する。
# `vector(1) > 0` は常に true のため、Prometheus がルールを評価した瞬間から firing する。
# 検証完了後、このファイル / monitoring.py の apply 箇所 / 対応テストパラメータを 1 つの PR で削除する。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alertmanager-smoke-rules
  namespace: monitoring
  labels:
    role: alert-rules
spec:
  groups:
    - name: alertmanager-smoke
      rules:
        - alert: AlertmanagerSmokeTest
          expr: vector(1) > 0
          for: 1m
          labels:
            severity: warning
            smoke: "true"
          annotations:
            summary: "Alertmanager smoke test (always firing)"
            description: "This alert always fires; used to verify Prometheus -> Alertmanager -> SNS notification path."
