# in-cluster Prometheus（StatefulSet）を chart 同梱で動かす構成。
# scrape は Prometheus Operator + PodMonitor / ServiceMonitor 経由（chart 同梱）。
# Grafana は同 chart 同梱の in-cluster Prometheus を datasource として直接 query する。
# Alertmanager は 3 replica HA で有効化、通知先は AWS SNS（Pod Identity で sns:Publish）。

# chart 同梱の KubeletTooManyPods は severity: info 固定で、chart には個別ルールの severity を
# 上書きする値が無い（defaultRules.disabled で無効化のみ可能）。Cluster Autoscaler / Karpenter を
# 持たず nodegroup が固定サイズの本環境では Pod capacity 到達がスケールアウトで自動解消されず
# 新規 Pod が Pending に固定されるため、ここで無効化して prometheus-rules-node.yaml 側で
# severity: warning として再定義する。
defaultRules:
  disabled:
    KubeletTooManyPods: true

# EKS のコントロールプレーンは AWS マネージドで kube-controller-manager / kube-scheduler を
# 外部から scrape できない。chart デフォルトの enabled: true のままだと到達不能な ServiceMonitor が
# 作られ、それに gate された KubeControllerManagerDown / KubeSchedulerDown が常時 firing する
# （up{job=...} == 1 が出ないため absent() 型ルールが発火）。component ごと無効化すると
# ServiceMonitor とデフォルトアラートルールの両方が消える。kube-proxy は EKS でも scrape 可能なため
# 残す。etcd は同じく scrape 不可だが etcd 系ルールは値依存型で発火しておらず、消す効果は
# Targets 画面の dead ターゲット掃除のみのため現状は据え置く。
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false

prometheus:
  enabled: true
  # CDK 側で Pod Identity 付き SA を作らない（in-cluster Prometheus は AWS API を
  # 叩かないため IAM 不要）。chart デフォルトの SA に任せる。
  prometheusSpec:
    # 2 replica HA。同じ scrape を 2 本独立に走らせ、片方の Pod や AZ 障害で
    # メトリクスが完全に欠けないようにする。Service が 2 Pod 間で
    # ロードバランスするため Grafana 側の datasource 設定は変更不要。
    # データ重複排除（Thanos / Mimir 等）は導入しない: 短期保存の
    # ダッシュボード用途では 2 系列の値が同等で実害が無い。
    replicas: <PROMETHEUS_REPLICAS>
    # 15 日保持。retention とサンプル取り込みレートで PVC 容量が決まる。
    # 60s scrape × ~70K series × 15 日 = 約 8GB（圧縮後）見込み。
    # gp3 20Gi はその約 2.5 倍のヘッドルームで、cardinality が増えても余裕がある。
    # 各 replica が独立に保管するため EBS 代は replicas 数に比例（20Gi × 2 = 40Gi）。
    retention: <PROMETHEUS_RETENTION>
    # cardinality / series 数が環境で変わった場合に調整できるよう明示化（chart デフォルトと同値）。
    scrapeInterval: <PROMETHEUS_SCRAPE_INTERVAL>
    # 全 Namespace の ServiceMonitor / PodMonitor を対象にする（PodMonitor を
    # 任意 NS に置けるようにするため）。
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    # tolerations 未指定で system-nodegroup に乗る（kafka nodegroup の
    # DedicatedKafka taint には toleration を持たないため自然に弾かれる）
    resources:
      requests:
        memory: <PROMETHEUS_MEMORY_REQUEST>
        cpu: <PROMETHEUS_CPU_REQUEST>
      limits:
        memory: <PROMETHEUS_MEMORY_LIMIT>
        cpu: <PROMETHEUS_CPU_LIMIT>
    # 2 replica を別 AZ に分散させて AZ 単一障害耐性を確保する。
    # ScheduleAnyway は best-effort（AZ 偏りを許容してでも schedule する）。
    # DoNotSchedule にすると Node 不足や AZ 不整合で Pod が Pending に陥り、
    # 起動失敗が監視欠損に直結するため避ける。
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: <PROMETHEUS_STORAGE_SIZE>
  # chart デフォルトは enabled: false で、2 replica HA でもノードドレインで両 Pod が
  # 同時 evict されうる。active-active で片肺残しを保証するため有効化する。
  # 値は chart デフォルトの minAvailable: 1 にそのまま乗る（templates が omit "enabled" で
  # 残りを spec にダンプする実装で、maxUnavailable はコメントアウト済みなので値が無い）。
  podDisruptionBudget:
    enabled: true

prometheusOperator:
  enabled: true

alertmanager:
  enabled: true
  # CDK 側で Pod Identity 紐付き SA を作成するため Helm からは作らない。
  # sns:Publish を Topic ARN 限定で付与し、SigV4 で SNS に投稿する。
  serviceAccount:
    create: false
    name: alertmanager
  alertmanagerSpec:
    # 3 replica gossip cluster（標準サイズ）。AZ 単一障害でも 2 peer 残る。
    # active-active gossip による通知の de-dup で重複配信を抑える（Prometheus の
    # active-active 2 replica と組み合わせて経路全体が単一障害耐性を持つ）。
    replicas: <ALERTMANAGER_REPLICAS>
    # 3 replica を 3 AZ に分散させる。AZ 不整合で Pod が Pending にならないよう
    # ScheduleAnyway（Prometheus と同じ best-effort 方針）。
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: alertmanager
    # Alertmanager は処理量が小さいため Prometheus 比でかなり軽量。
    resources:
      requests:
        memory: <ALERTMANAGER_MEMORY_REQUEST>
        cpu: <ALERTMANAGER_CPU_REQUEST>
      limits:
        memory: <ALERTMANAGER_MEMORY_LIMIT>
        cpu: <ALERTMANAGER_CPU_LIMIT>
    # notification log（同一通知の二重送信防止）と silence 設定の永続化。
    # Pod 再起動でこれらが消えると、再起動直後に既送通知が再送されたり
    # 設定済み silence が失効したりして運用ノイズが増えるため、永続ボリュームを必須にする。
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: <ALERTMANAGER_STORAGE_SIZE>
  # chart デフォルトは enabled: false で、3 replica あっても PDB が生成されずノードドレインで
  # 同時 evict されうる。enabled: true だけ渡せば chart デフォルトの minAvailable: 1 に乗る
  # （Prometheus の PDB と同じ流儀）。templates が omit "enabled" で残りを spec にダンプする
  # 実装のため maxUnavailable と minAvailable を同時に渡すと K8s API validation で拒否される。
  podDisruptionBudget:
    enabled: true
  # 通知設定（alertmanager.yaml としてレンダリングされ Secret に入る）。
  # SNS_TOPIC_ARN / REGION は CDK の load_with_subs で synth 時に置換される。
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'cluster', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: default-sns
      # Watchdog（常時 firing の dead-man-switch）と InfoInhibitor は通知価値が薄いので
      # null receiver で破棄する（chart デフォルトの routes が同じ構造を持つが、Helm の
      # deep merge では map は merge / list は置換のため、receivers を置き換えると
      # chart デフォルトの routes が孤立して "undefined receiver null" エラーになる。
      # routes と receivers の両方を user values で明示することで整合させる）。
      routes:
        - receiver: 'null'
          matchers:
            - alertname =~ "InfoInhibitor|Watchdog"
        # 経路疎通確認用の smoke は常時 firing 設計。subscribe 完了から初回受信までの
        # 待ち時間を最短化するため、smoke 専用 route で group_wait と repeat_interval を
        # 極短に設定する（group_wait: 0s で初回 publish 即時、repeat_interval: 1m で
        # subscribe 完了後最大 1 分以内に受信できる）。smoke 削除 PR を出すまでに通知が
        # 数通積もるが、検証用途では許容範囲。smoke ルール削除と同時にこの route も削除。
        - receiver: default-sns
          matchers:
            - alertname = "AlertmanagerSmokeTest"
          group_wait: 0s
          repeat_interval: 1m
    receivers:
      # chart デフォルトの routes が参照する破棄用 receiver。
      - name: 'null'
      - name: default-sns
        sns_configs:
          # sigv4 ブロックで region を指定すると Alertmanager は AWS SDK の
          # デフォルト認証チェーンを通る。EKS Pod Identity Agent が env var に
          # 注入する一時クレデンシャル経由で sns:Publish を実行する。
          - topic_arn: <SNS_TOPIC_ARN>
            sigv4:
              region: <REGION>
            # SNS Subject は 100 文字 + ASCII のみの制約があり、Alertmanager デフォルト
            # template は CommonLabels を含んで制限を超えやすい（"invalid parameter
            # Subject" で送信失敗）。chart の tpl 評価と Alertmanager の Go template の
            # 干渉でテンプレートが壊れる事例もあるため、subject は固定文字列にして
            # 識別は message body の Alertmanager デフォルト template に任せる。
            subject: 'Alertmanager Notification'
      # 将来 Microsoft Teams 通知を Alertmanager から直接呼ぶ場合の雛形（現状未使用）。
      # 新規導入は Power Automate Workflows ベースの URL を
      # msteamsv2_configs（Adaptive Card 形式、Alertmanager 0.28+）で使う。
      # 復活させる前に決める前提:
      #   (1) Teams 内 Workflows アプリで "Post to a channel when a webhook request is
      #       received" テンプレートから Workflow URL を発行する
      #   (2) URL を Secrets Manager に保管し External Secrets Operator で Alertmanager
      #       Pod に Secret として注入する（この YAML に平文で URL を書かない）
      #   (3) alertmanagerSpec.secrets で Secret を mount → webhook_url_file で参照
      #   (4) route 側で severity 別に default-sns と teams を振り分け、接続失敗時の
      #       retry が他通知をブロックしないよう独立 receiver にする
      # - name: teams
      #   msteamsv2_configs:
      #     - webhook_url_file: /etc/alertmanager/secrets/teams-workflow/url
      #       send_resolved: true
    # critical が発火している間、同一対象の warning は抑止する（多重通知の抑制）。
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['alertname', 'cluster']

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  grafana.ini:
    log:
      level: warn
  # CDK 側で Pod Identity 紐付き SA を作成するため Helm からは作らない。
  # IAM 不要（in-cluster Prometheus を query するだけ）。SA は CDK で作るため
  # chart からは create: false にする。
  serviceAccount:
    create: false
    name: grafana
  adminPassword: admin
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      logLevel: WARN
    datasources:
      enabled: true
      searchNamespace: ALL
      logLevel: WARN
  # chart デフォルトで in-cluster Prometheus を datasource (name: Prometheus,
  # isDefault: true) として自動登録する。Strimzi 公式 dashboard が "Prometheus"
  # 名でハードコード参照するため、デフォルトのまま維持。

# node-exporter は DaemonSet なので全 Taint を許容する
prometheus-node-exporter:
  tolerations:
    - operator: Exists

# kube-state-metrics / prometheusOperator は toleration 未指定のまま system に乗る
# （kafka nodegroup の DedicatedKafka taint で kafka ノードからは弾かれる）
