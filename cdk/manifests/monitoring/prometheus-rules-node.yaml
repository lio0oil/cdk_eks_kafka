# kube-prometheus-stack 同梱の KubeletTooManyPods を severity だけ info -> warning に上げた再定義。
# chart 側は kube-prometheus-stack-values.yaml の defaultRules.disabled で無効化済み（chart には
# 個別ルールの severity 上書き手段が無いため「無効化 + 再定義」で対応する）。
# 本環境は Cluster Autoscaler / Karpenter を持たず nodegroup が固定サイズのため、Pod capacity 到達は
# スケールアウトで自動解消されず新規 Pod が Pending に固定される。info ではなく warning で扱う。
# expr は chart 84.5.0 の KubeletTooManyPods を写したもの。chart を更新したら expr を再同期すること。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-capacity-rules
  namespace: monitoring
  labels:
    role: alert-rules
spec:
  groups:
    - name: node-capacity
      rules:
        - alert: KubeletTooManyPods
          expr: |-
            count by(cluster, node) (
              (kube_pod_status_phase{job="kube-state-metrics", phase="Running"} == 1) * on(instance,pod,namespace,cluster) group_left(node) topk by(instance,pod,namespace,cluster) (1, kube_pod_info{job="kube-state-metrics"})
            )
            /
            max by(cluster, node) (
              kube_node_status_capacity{job="kube-state-metrics", resource="pods"} != 1
            ) > 0.95
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Kubelet is running at capacity."
            description: "Kubelet '{{ $labels.node }}' on cluster {{ $labels.cluster }} is running at {{ $value | humanizePercentage }} of its Pod capacity."
