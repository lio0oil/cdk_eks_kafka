apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: <BINDING_NAME>
  namespace: kafka
spec:
  serviceRef:
    name: <SERVICE_NAME>
    port: <SERVICE_PORT>
  targetGroupARN: <TARGET_GROUP_ARN>
  targetType: instance
  # nodeSelector を指定しないと AWS LBC はクラスタ内の全ノード（system-nodegroup /
  # kafka-controller-nodegroup 含む）を EC2 instance target として登録してしまう
  # （externalTrafficPolicy: Local はその Pod のいないノードを Unhealthy にするだけで、
  # target 登録自体は防げない）。broker nodegroup のノードラベル（role: kafka-broker）で
  # 絞り込み、broker 以外のノードグループが target group に現れないようにする。
  # nodeSelector は標準の LabelSelector 型（matchLabels/matchExpressions）で、
  # map[string]string 直書きは CRD スキーマ上 unknown field になる。
  nodeSelector:
    matchLabels:
      role: kafka-broker
  # AWS LBC がノード SG に NLB SG からの NodePort 受け入れルールを自動追加する。
  # 明示することで何の通信を許可するかが透明になり、AWS LBC の auto-detect 動作に
  # 依存せずに済む。
  networking:
    ingress:
      - from:
          - securityGroup:
              groupID: <NLB_SG_ID>
        ports:
          - protocol: TCP
            port: <NODE_PORT>
