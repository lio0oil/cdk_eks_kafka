default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.15.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: cdk-ruff-check
        name: cdk / ruff check
        entry: uv run --project cdk ruff check --fix
        language: system
        types: [python]
        files: ^cdk/
        require_serial: true
      - id: cdk-ruff-format
        name: cdk / ruff format
        entry: uv run --project cdk ruff format
        language: system
        types: [python]
        files: ^cdk/
        require_serial: true
      - id: cdk-pyright
        name: cdk / pyright
        entry: uv run --directory cdk pyright
        language: system
        types: [python]
        files: ^cdk/
        pass_filenames: false
      - id: cdk-pytest
        name: cdk / pytest
        entry: uv run --directory cdk pytest
        language: system
        files: ^cdk/
        pass_filenames: false
        stages: [pre-commit]
      - id: terraform-fmt
        name: terraform / fmt
        entry: terraform fmt -check -recursive -diff terraform
        language: system
        files: ^terraform/.*\.(tf|tfvars|tftest\.hcl)$
        pass_filenames: false
      - id: terraform-test
        name: terraform / validate + test
        # terraform test 内の相対パスは cwd 基準のため、module ごとに -chdir で実行する
        entry: >-
          bash -c 'set -e; for d in terraform/modules/*/; do
          terraform -chdir="$d" init -backend=false -input=false >/dev/null;
          terraform -chdir="$d" validate;
          [ -d "$d/tests" ] && terraform -chdir="$d" test; done; true'
        language: system
        files: ^(terraform/|cdk/manifests/kafka/)
        pass_filenames: false
        stages: [pre-commit]
      - id: terraform-tflint
        name: terraform / tflint
        entry: tflint --recursive --chdir=terraform
        language: system
        files: ^terraform/.*\.(tf|tfvars)$
        pass_filenames: false
