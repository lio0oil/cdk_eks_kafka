default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.15.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: cdk-ruff-check
        name: cdk / ruff check
        entry: uv run --project cdk ruff check --fix
        language: system
        types: [python]
        files: ^cdk/
        require_serial: true
      - id: cdk-ruff-format
        name: cdk / ruff format
        entry: uv run --project cdk ruff format
        language: system
        types: [python]
        files: ^cdk/
        require_serial: true
      - id: cdk-pyright
        name: cdk / pyright
        entry: uv run --directory cdk pyright
        language: system
        types: [python]
        files: ^cdk/
        pass_filenames: false
      - id: cdk-pytest
        name: cdk / pytest
        entry: uv run --directory cdk pytest
        language: system
        files: ^cdk/
        pass_filenames: false
        stages: [pre-commit]
      - id: terraform-fmt
        name: terraform / fmt
        entry: terraform fmt -check -recursive -diff terraform
        language: system
        files: ^terraform/.*\.(tf|tfvars|tftest\.hcl)$
        pass_filenames: false
      - id: terraform-test
        name: terraform / validate + test
        entry: bash terraform/scripts/check.sh
        language: system
        files: ^terraform/
        pass_filenames: false
        stages: [pre-commit]
      - id: terraform-tflint
        name: terraform / tflint
        entry: tflint --recursive --chdir=terraform
        language: system
        files: ^terraform/.*\.(tf|tfvars)$
        pass_filenames: false
      - id: parquet-merge-writer-ruff-check
        name: parquet-merge writer / ruff check
        entry: uv run --project parquet-merge/writer ruff check --fix
        language: system
        types: [python]
        files: ^parquet-merge/writer/
        exclude: _pb2\.pyi?$
        require_serial: true
      - id: parquet-merge-writer-ruff-format
        name: parquet-merge writer / ruff format
        entry: uv run --project parquet-merge/writer ruff format
        language: system
        types: [python]
        files: ^parquet-merge/writer/
        exclude: _pb2\.pyi?$
        require_serial: true
      - id: parquet-merge-writer-pyright
        name: parquet-merge writer / pyright
        entry: uv run --directory parquet-merge/writer pyright
        language: system
        types: [python]
        files: ^parquet-merge/writer/
        pass_filenames: false
      - id: parquet-merge-writer-pytest
        name: parquet-merge writer / pytest
        entry: uv run --directory parquet-merge/writer pytest
        language: system
        files: ^parquet-merge/(writer|contract)/
        pass_filenames: false
        stages: [pre-commit]
      - id: parquet-merge-merger-ruff-check
        name: parquet-merge merger / ruff check
        entry: uv run --project parquet-merge/merger ruff check --fix
        language: system
        types: [python]
        files: ^parquet-merge/merger/
        require_serial: true
      - id: parquet-merge-merger-ruff-format
        name: parquet-merge merger / ruff format
        entry: uv run --project parquet-merge/merger ruff format
        language: system
        types: [python]
        files: ^parquet-merge/merger/
        require_serial: true
      - id: parquet-merge-merger-pyright
        name: parquet-merge merger / pyright
        entry: uv run --directory parquet-merge/merger pyright
        language: system
        types: [python]
        files: ^parquet-merge/merger/
        pass_filenames: false
      - id: parquet-merge-merger-pytest
        name: parquet-merge merger / pytest
        entry: uv run --directory parquet-merge/merger pytest
        language: system
        files: ^parquet-merge/(merger|contract|tables)/
        pass_filenames: false
        stages: [pre-commit]
      - id: parquet-merge-terraform-fmt
        name: parquet-merge terraform / fmt
        entry: terraform fmt -check -recursive -diff parquet-merge/terraform
        language: system
        files: ^parquet-merge/terraform/.*\.(tf|tfvars|tftest\.hcl)$
        pass_filenames: false
      - id: parquet-merge-terraform-test
        name: parquet-merge terraform / validate + test
        entry: bash parquet-merge/terraform/scripts/check.sh
        language: system
        files: ^parquet-merge/terraform/
        pass_filenames: false
        stages: [pre-commit]
      - id: parquet-merge-terraform-tflint
        name: parquet-merge terraform / tflint
        entry: tflint --recursive --chdir=parquet-merge/terraform
        language: system
        files: ^parquet-merge/terraform/.*\.(tf|tfvars)$
        pass_filenames: false
